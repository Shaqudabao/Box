name: Build Phone Debug (大嗓门之家)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Create local.properties (sdk.dir)
        run: echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties

      - name: Build phone debug APK (arm64 + armeabi)
        run: ./gradlew assembleArm64GenericNormalDebug assembleArmeabiGenericNormalDebug --build-cache --parallel --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dabaotv-phone-debug
          path: app/build/outputs/apk/**/generic/normal/debug/*.apk
